appId: com.istalry.clipreframe
productName: ClipReframe
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  # Third-party binaries downloaded by `pnpm fetch-binaries`; kept outside the asar so they can be spawned.
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
  # Licence texts ship next to the binaries they cover.
  - from: LICENSE
    to: LICENSE
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
asar: true
win:
  target:
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico
  artifactName: ${productName}-${version}-portable.${ext}
portable:
  # Keep the extracted app between runs so the ~500 MB model is not re-extracted every launch.
  unpackDirName: ClipReframe
npmRebuild: false
electronLanguages:
  - en-US
  - fr
