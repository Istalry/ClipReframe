name: Bug report
description: Something does not work as described in the user guide
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please check HOW-TO-USE.md (Troubleshooting) first.
  - type: input
    id: version
    attributes:
      label: ClipReframe version
      placeholder: e.g. 0.1.0 (file name of the exe)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open clip … 2. Click … 3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected / what happened instead
    validations:
      required: true
  - type: textarea
    id: clip
    attributes:
      label: Source clip details
      description: Output of `ffprobe your-clip.mp4` if you have it, otherwise resolution, codec, fps and number of audio tracks.
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: The exact text of the red toast, if any. Running the exe from a terminal prints the full log to that window; paste the relevant lines here.
      render: text
