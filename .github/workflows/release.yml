name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release and upload the exe

jobs:
  build:
    name: Build portable exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Fetch pinned third-party binaries (checksum-verified)
        run: pnpm fetch-binaries

      - name: Package
        run: pnpm dist

      - name: Extract this version's changelog section
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## [$version]" '
            index($0, h) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No CHANGELOG section for $version" >&2; exit 1
          fi
          echo "--- release notes ---"; cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ClipReframe ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: release/*.exe
          fail_on_unmatched_files: true
